<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laniya's Touch — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --navy:#0e2a3a; --navy-2:#16384c; --ink:#12202a; --teal:#1a7a6d; --teal-2:#249688;
  --mint:#d8f0eb; --foam:#f3faf8; --gold:#c4a35a; --paper:#f7f4ee; --white:#fff;
  --line:#d9e4e1; --muted:#5b6d75; --danger:#b54a3c; --ok:#1f7a4d; --warn:#b7791f;
  --shadow:0 10px 30px rgba(14,42,58,.08); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"DM Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font-family:inherit}
.app{display:flex;height:100dvh;min-height:0}
aside{width:260px;background:linear-gradient(180deg,var(--navy),#0b2230);color:#e8f2f0;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.mark{width:40px;height:40px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700}
.brand h1{font-family:Fraunces,serif;font-size:18px;margin:12px 0 2px;font-weight:600}
.brand p{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9bb3b8}
nav{padding:12px;display:flex;flex-direction:column;gap:4px}
nav button{appearance:none;border:0;background:transparent;color:#c9d9dc;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.active{background:rgba(36,150,136,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(36,150,136,.35)}
.aside-foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#8aa0a6;line-height:1.45}
.aside-foot strong{color:#d7e6e4}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
main{flex:1;overflow:auto;padding:24px 28px 56px}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
h2.page{font-family:Fraunces,serif;font-size:32px;margin:0;letter-spacing:-.03em;color:var(--navy)}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch;line-height:1.55}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{flex-direction:column;height:auto;min-height:100dvh}
  aside{width:100%;height:auto}
  nav{flex-direction:row;flex-wrap:wrap}
  .g5,.g4,.g2{grid-template-columns:1fr}
  main{padding:16px}
}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat{font-family:Fraunces,serif;font-size:30px;color:var(--navy);letter-spacing:-.03em}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--navy);color:#fff;font-weight:600;font-size:13px}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1px var(--line)}
.btn.teal{background:var(--teal)}
.btn.small{padding:6px 10px;font-size:12px}
.pill{display:inline-flex;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;background:var(--mint);color:var(--teal)}
.pill.red{background:#f8dcd8;color:var(--danger)}
.pill.amber{background:#f8e7c9;color:#8a5a10}
.pill.green{background:#dcefe3;color:var(--ok)}
.pill.navy{background:#e4eef3;color:var(--navy)}
.pill.muted{background:#eef1f2;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #eef3f2;vertical-align:top}
tr:hover td{background:var(--foam)}
label.field{display:block;font-size:12px;font-weight:600;color:var(--navy);margin:0 0 6px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;width:100%;background:#fff}
textarea{min-height:72px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.modal-back{position:fixed;inset:0;background:rgba(14,42,58,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:0}
.modal-back.open{display:flex}
.modal{background:#fff;width:min(640px,100%);border-radius:18px 18px 0 0;padding:22px;max-height:92dvh;overflow:auto}
@media(min-width:700px){.modal-back{align-items:center;padding:20px}.modal{border-radius:18px}}
.attn{border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;background:#fff}
.attn.red{background:#fdf4f2;border-color:#f0c9c3}
.attn.amber{background:#fdf8ee;border-color:#f0ddb3}
.attn.green{background:#f3faf5;border-color:#c9e6d2}
.bar{height:10px;background:#e7efed;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--teal)}
.photos{display:flex;gap:8px;overflow:auto;margin-top:8px}
.photos img,.photos video{height:88px;border-radius:10px;object-fit:cover}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.hidden{display:none !important}
.menu-btn{display:none}
@media(max-width:860px){.menu-btn{display:inline-flex}}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef3f2;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside id="aside">
    <div class="brand">
      <div class="mark">LT</div>
      <h1>Laniya's Touch</h1>
      <p>Command center · 90 days</p>
    </div>
    <nav id="nav"></nav>
    <div class="aside-foot">
      Bookmark this page — it keeps working when Grok is closed.<br/>
      Use <strong>Export</strong> to save a backup of your numbers.
    </div>
  </aside>
  <div class="shell">
    <header class="top">
      <button class="btn ghost small menu-btn" onclick="toggleMenu()">Menu</button>
      <span style="margin-right:auto;font-family:Fraunces,serif;color:var(--navy)" class="menu-btn">Laniya's Touch</span>
      <button class="btn ghost small" onclick="exportJson()">Export backup</button>
      <label class="btn ghost small" style="cursor:pointer">Import<input id="imp" type="file" accept="application/json" class="hidden"></label>
      <button class="btn ghost small" onclick="if(confirm('Reset to the seeded command center?')) resetDemo()">Reset demo</button>
    </header>
    <main><div class="wrap" id="root"></div></main>
  </div>
</div>
<div class="modal-back" id="modal"><div class="modal" id="modalBody"></div></div>

  if(!reasons.length) reasons.push("High-margin / low-maintenance");
  return {c,booked,el,estMargin,ar,overdue,openC,qcPass,rag,reasons,visits30};
}
function staffCard(s){
  const att=state.attendance.filter(a=>a.staffId===s.id&&lastN(a.date,35)&&a.scheduled);
  const scheduled=att.length;
  const present=att.filter(a=>a.status==="present"||a.status==="late").length;
  const visits=state.visits.filter(v=>v.crewIds.includes(s.id)&&lastN(v.date,35));
  const inspected=visits.filter(v=>v.qcScore!=="Not inspected");
  const rework=visits.filter(v=>v.qcScore==="Redo").length;
  return {
    s, scheduled, present, late:att.filter(a=>a.status==="late").length,
    absent:att.filter(a=>a.status==="absent").length,
    attendance: scheduled?present/scheduled:0,
    jobs:visits.length, hours:visits.reduce((a,v)=>a+(Number(v.hoursActual)||0),0),
    ot:visits.reduce((a,v)=>a+(Number(v.overtimeHours)||0),0),
    rework, complaints:state.complaints.filter(k=>k.staffId===s.id&&lastN(k.date,45)).length,
    compliments:state.compliments.filter(k=>k.staffId===s.id&&lastN(k.date,45)).length,
    qcRate: inspected.length? inspected.filter(v=>v.qcScore==="Pass").length/inspected.length : 0
  };
}
function moneyLeak(){
  const active=state.clients.filter(c=>c.status==="Active");
  const booked=active.reduce((a,c)=>a+monthlyBooked(c),0);
  const vs=state.visits.filter(v=>lastN(v.date,31));
  let labour=0,otPrem=0,supplies=0,transport=0;
  vs.forEach(v=>{
    const r=rateSum(v.crewIds); const ot=Number(v.overtimeHours)||0;
    const base=Math.max(0,(Number(v.hoursActual)||0)-ot);
    labour+=base*r; otPrem+=ot*r*0.5;
    supplies+=Number(v.suppliesCost)||0; transport+=Number(v.transportCost)||0;
  });
  const o=state.overhead||{};
  const overhead=(+o.rent||0)+(+o.insurance||0)+(+o.vehicle||0)+(+o.supplies||0)+(+o.admin||0)+(+o.other||0);
  const fuel=+o.fuel||0, ownerDraw=+o.ownerDraw||0;
  const leftover=booked-labour-otPrem-supplies-transport-fuel-overhead-ownerDraw;
  const ar=state.invoices.filter(i=>i.status!=="paid").reduce((a,i)=>a+i.amount,0);
  const collected=state.invoices.filter(i=>i.status==="paid"&&lastN(i.paidDate||i.date,35)).reduce((a,i)=>a+i.amount,0);
  return {booked,labour,otPrem,supplies,transport,fuel,overhead,ownerDraw,leftover,ar,collected};
}
function currentSnap(){
  const L=moneyLeak();
  const expenses=L.labour+L.otPrem+L.supplies+L.transport+L.fuel+L.overhead+L.ownerDraw;
  const jobs=state.visits.filter(v=>lastN(v.date,35));
  const avg=jobs.length?jobs.reduce((a,v)=>a+(Number(clientBy(v.clientId)?.price)||0),0)/jobs.length:0;
  return {
    revenue:L.booked, expenses, labour:L.labour+L.otPrem,
    grossMargin:L.booked?(L.booked-L.labour-L.otPrem-L.supplies-L.transport)/L.booked:0,
    net:L.leftover, clientCount:state.clients.filter(c=>c.status==="Active").length,
    avgJobValue:avg, complaints:state.complaints.filter(k=>lastN(k.date,35)).length,

  };
}
function ceoCards(){
  const diags=state.clients.filter(c=>c.status==="Active").map(clientDiag);
  const below=diags.filter(d=>d.estMargin<d.c.targetMargin);
  const qcNeed=state.visits.filter(v=> (v.sampled&&!v.sampledReviewed) || (v.qcScore==="Not inspected"&&lastN(v.date,10)));

  ];

    ${next?`<div class="card" style="background:var(--foam)"><div class="kicker">Next action</div><b>${esc(next.title)}</b><p class="note">${esc(next.body)}</p></div>`:""}
    ${mediaHtml(photos)}
    <h4>Invoices</h4>
    ${invoices.map(i=>`<div class="note">${i.date} due ${i.dueDate} · ${bbd(i.amount)} · ${i.status}</div>`).join("")}
    <h4>Complaints</h4>
    ${complaints.map(k=>`<div class="card" style="background:#fdf4f2;margin:6px 0">${k.date} — ${esc(k.text)} ${k.resolved?" (resolved "+k.resolvedAt+")":`<button class="btn teal small" onclick="resolveK('${k.id}')">Mark resolved</button>`}</div>`).join("")||"<p class='note'>None</p>"}
    <h4>QC history</h4>
    ${visits.slice(0,8).map(v=>`<div class="note">${v.date} · ${v.hoursActual}h · ${v.qcScore}${v.issue?" · "+esc(v.issue):""}</div>`).join("")}
    <div style="margin-top:12px;text-align:right"><button class="btn ghost" onclick="closeModal()">Close</button></div>
  `);
}
function resolveK(id){ const k=state.complaints.find(x=>x.id===id); if(k){k.resolved=true;k.resolvedAt=iso();save();closeModal();render();} }
function renderNinety(){
  const b=state.baseline; const c=currentSnap();
  const rows=[
    ["Revenue (booked / mo)", b.revenue, c.revenue, c.revenue>=b.revenue],
    ["Expenses", b.expenses, c.expenses, c.expenses<=b.expenses],
    ["Labour", b.labour, c.labour, c.labour<=b.labour],
    ["Gross margin", Math.round(b.grossMargin*100)+"%", Math.round(c.grossMargin*100)+"%", c.grossMargin>=b.grossMargin],
    ["Net", b.net, c.net, c.net>=b.net],
    ["Client count", b.clientCount, c.clientCount, c.clientCount>=b.clientCount],
    ["Average job value", b.avgJobValue, Math.round(c.avgJobValue), c.avgJobValue>=b.avgJobValue],
    ["Complaints", b.complaints, c.complaints, c.complaints<=b.complaints],
    ["Rework", b.rework, c.rework, c.rework<=b.rework]
  ];
  const start=new Date(state.engagementStart+"T12:00:00");
  const elapsed=Math.max(0,Math.round((Date.now()-start.getTime())/86400000));
  const fmt=(label,v)=> (label.includes("margin")||label.includes("count")||label==="Complaints"||label==="Rework")?v:bbd(Number(v));
  return `
    <div class="topbar"><div>
      <p class="eyebrow">3-month management dashboard</p>
      <h2 class="page">Before, after, and what changed</h2>
      <p class="lede">Baseline is the as-found month. Live is the hub now. Close the action loop and these numbers move.</p>
    </div></div>
    <div class="grid g3">
      <div class="card"><div class="kicker">Engagement</div><div class="stat">${elapsed} / 90 days</div><div class="note">Started ${state.engagementStart}</div></div>
      <div class="card"><div class="kicker">Baseline</div><div class="stat" style="font-size:22px">${esc(b.label)}</div></div>
      <div class="card"><div class="kicker">Live</div><div class="stat" style="font-size:22px">As of ${c.asOf}</div></div>
    </div>
    <div class="card" style="margin-top:16px;overflow:auto">
      <table><thead><tr><th>Metric</th><th>Before</th><th>After</th><th>Direction</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${typeof r[1]==="number"&&!String(r[0]).includes("count")&&r[0]!=="Complaints"&&r[0]!=="Rework"?bbd(r[1]):r[1]}</td><td>${typeof r[2]==="number"&&!String(r[0]).includes("count")&&r[0]!=="Complaints"&&r[0]!=="Rework"?bbd(r[2]):r[2]}</td><td>${r[3]?pill("green").replace("Green","Better"):pill("amber").replace("Amber","Watch")}</td></tr>`).join("")}</tbody></table>
    </div>`;
}
function renderGrowth(){
  const SEQ=["Email","Phone","Visit","Proposal","Follow-up"];
  return `
    <div class="topbar"><div>
      <p class="eyebrow">Growth</p>
      <h2 class="page">100-business pipeline</h2>
      <p class="lede">Prospects are hunting. Won work becomes a client dossier.</p>
    </div></div>
    <div class="card" style="overflow:auto"><table>
      <thead><tr><th>Business</th><th>Tier</th><th>Stage</th><th>Next</th></tr></thead>
      <tbody>${state.prospects.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="note">${esc(p.sector)}</div></td><td>T${p.tier}</td><td>${esc(p.stage)}</td><td class="note">${esc(p.next)}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

const VIEWS={ceo:renderCeo,money:renderMoney,quality:renderQuality,staff:renderStaff,clients:renderClients,ninety:renderNinety,growth:renderGrowth};
function render(){
  renderNav();
  document.getElementById("root").innerHTML=VIEWS[view]();
}
function exportJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="laniya-ops-hub.json"; a.click();
}
function resetDemo(){ state=structuredClone(SEED); save(); render(); }
document.getElementById("imp").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ state=Object.assign({}, structuredClone(SEED), JSON.parse(t)); save(); render(); });
};
load();
render();
</script>
